name: CI - Gutenberg Build and Lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: plugins/my-gutenberg-blocks/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install JS deps
        working-directory: plugins/my-gutenberg-blocks
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build Blocks
        working-directory: plugins/my-gutenberg-blocks
        run: npm run build

      - name: List build
        run: ls -la plugins/my-gutenberg-blocks/build/
