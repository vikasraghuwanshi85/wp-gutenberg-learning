
name: CI - Gutenberg Build and Lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: plugins/my-gutenberg-blocks/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, cs2pr

      - name: Install JS deps
        working-directory: plugins/my-gutenberg-blocks
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build Blocks
        working-directory: plugins/my-gutenberg-blocks
        run: npm run build

      - name: Check build output exists
        run: |
          ls -la plugins/my-gutenberg-blocks/build/
          echo "Checking for build files..."
          ls plugins/my-gutenberg-blocks/build/*.js
          if [ -f plugins/my-gutenberg-blocks/build/index.js ] || [ -f plugins/my-gutenberg-blocks/build/hero.js ]; then
            echo "✅ Blocks built successfully!"
          else
            echo "❌ No build files found!"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gutenberg-blocks-build
          path: plugins/my-gutenberg-blocks/build/
          retention-days: 7

